# The prod half of the backup: same script, same timer, same 03:00 UTC — only
# the compose overlay and the bucket differ. Deployed on whv-prod-api as
#   /etc/systemd/system/whv-backup.service.d/prod.conf
# (install -D -m 644 infra/systemd/whv-backup-prod.conf \
#    /etc/systemd/system/whv-backup.service.d/prod.conf && systemctl daemon-reload).
# This file ships in the repo for the same reason the SLR Caddy attach does
# (PR #24): box-only configuration is one redeploy away from being lost.
[Service]
Environment=COMPOSE_OVERLAY=docker-compose.prod.yml
Environment=RCLONE_REMOTE=b2:whv-prod-postgres-backups
