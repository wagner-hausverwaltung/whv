# Drop-in for the prod box: install as
#   /etc/systemd/system/whv-backup.service.d/prod.conf
# and `systemctl daemon-reload`. Same script, same timer, same 03:00 UTC; only
# the stack it dumps and the bucket it uploads to differ. See infra/docs/backups.md.
[Service]
Environment=COMPOSE_OVERRIDE=docker-compose.prod.yml
Environment=RCLONE_REMOTE=b2:whv-prod-postgres-backups
