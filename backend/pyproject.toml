[project]
name = "whv-backend"
version = "0.1.0"
description = "Wagner Hausverwaltung GmbH backend API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "redis[hiredis]>=5.2",
    # http2 extra (h2) required for APNs — Apple's push gateway is
    # HTTP/2-only. Same client also talks to Impower (HTTP/1.1 is
    # fine there; httpx negotiates per-connection).
    "httpx[http2]>=0.28",
    "uuid-utils>=0.10",
    "argon2-cffi>=25.1.0",
    "pyjwt[crypto]>=2.13.0",
    "email-validator>=2.3.0",
    "celery[redis]>=5.4",
    "python-multipart>=0.0.20",
    "boto3>=1.43.14",
    "reportlab>=4.4.0",
    # HEIC/HEIF decoder for Pillow. iPhone photos default to HEIC since
    # iOS 11 — without this they fail avatar upload with "Could not
    # decode image". register_heif_opener() must be called at import
    # time in app/integrations/storage/avatars.py.
    "pillow-heif>=0.18",
    # Google Gemini SDK for the LLM extraction pipeline (ADR-0008).
    # Native PDF input + structured output via response schemas. Swap-
    # out point lives in app/integrations/llm/__init__.py if we ever
    # add Anthropic / OpenAI.
    "google-generativeai>=0.8",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "datamodel-code-generator>=0.57.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app"]
extend-exclude = ["alembic/versions", "app/integrations/impower/_schemas_generated.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["app.tests.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "app.integrations.impower._schemas_generated"
ignore_errors = true

[[tool.mypy.overrides]]
# Celery ships no py.typed marker; the task decorator and many helpers
# are untyped. Allow the imports without complaining.
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ReportLab ships no type stubs (types-reportlab is third-party + partial).
# We only use a small platypus surface that we wrap inside our own
# typed render_result_pdf — accept the untyped imports.
module = ["reportlab", "reportlab.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The celery_app.task decorator is untyped — silence the decorator
# check just for the workers module so we don't have to noqa every task.
module = "app.workers.tasks"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["app/tests"]
addopts = "-ra --strict-markers"
