services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whv}
      POSTGRES_DB: ${POSTGRES_DB:-whv}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whv} -d ${POSTGRES_DB:-whv}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-whv}:${POSTGRES_PASSWORD:-whv}@postgres:5432/${POSTGRES_DB:-whv}
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-whv}:${POSTGRES_PASSWORD:-whv}@postgres:5432/${POSTGRES_DB:-whv}
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-whv}:${POSTGRES_PASSWORD:-whv}@postgres:5432/${POSTGRES_DB:-whv}
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

  # Static React SPA for Eigentümer / Mieter / Beirat. Build-arg VITE_API_BASE_URL
  # bakes the API origin into the bundle at compose-build time (the deploy
  # override in docker-compose.deploy.yml supplies the staging URL).
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "5173:80"

volumes:
  postgres-data:
  redis-data:
