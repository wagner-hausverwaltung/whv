services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whv}
      POSTGRES_DB: ${POSTGRES_DB:-whv}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whv} -d ${POSTGRES_DB:-whv}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Vector store for the RAG assistant (ADR-0013). A SEPARATE Postgres
  # from the app DB so live app data is never touched by an extension or
  # image swap. Dormant by default — the `rag` compose profile must be
  # active (COMPOSE_PROFILES=rag) for it to start, so prod doesn't run an
  # unused container until the assistant launches.
  vectordb:
    image: pgvector/pgvector:pg16
    profiles: ["rag"]
    environment:
      POSTGRES_USER: ${RAG_POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${RAG_POSTGRES_DB:-rag}
    volumes:
      - vectordb-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RAG_POSTGRES_USER:-rag} -d ${RAG_POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-whv}:${POSTGRES_PASSWORD:-whv}@postgres:5432/${POSTGRES_DB:-whv}
      REDIS_URL: redis://redis:6379/0
      # RAG vector store (separate pgvector container, ADR-0013). Unused
      # until RAG_ENABLED=true; harmless to set unconditionally.
      RAG_DATABASE_URL: postgresql+asyncpg://${RAG_POSTGRES_USER:-rag}:${RAG_POSTGRES_PASSWORD:-rag}@vectordb:5432/${RAG_POSTGRES_DB:-rag}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Shared upload tree. Mounted on both backend (which writes) and
    # worker (which reads for the LLM extraction Celery task — without
    # this mount the worker has its own ephemeral filesystem and
    # invitation_pdf_url points at a path that doesn't exist on
    # the worker side → silent no_source_pdf). Also persists uploads
    # across `compose up -d` redeploys until §1.4d iter 2 swaps in
    # Hetzner Object Storage.
    volumes:
      - whv-uploads:/var/lib/whv
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-whv}:${POSTGRES_PASSWORD:-whv}@postgres:5432/${POSTGRES_DB:-whv}
      REDIS_URL: redis://redis:6379/0
      # RAG vector store — the worker runs ingestion + embedding (ADR-0013).
      RAG_DATABASE_URL: postgresql+asyncpg://${RAG_POSTGRES_USER:-rag}:${RAG_POSTGRES_PASSWORD:-rag}@vectordb:5432/${RAG_POSTGRES_DB:-rag}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - whv-uploads:/var/lib/whv

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-whv}:${POSTGRES_PASSWORD:-whv}@postgres:5432/${POSTGRES_DB:-whv}
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

  # Static React SPA for Eigentümer / Mieter / Beirat. Build-arg VITE_API_BASE_URL
  # bakes the API origin into the bundle at compose-build time (the deploy
  # override in docker-compose.deploy.yml supplies the staging URL).
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "5173:80"

volumes:
  postgres-data:
  redis-data:
  whv-uploads:
  vectordb-data:
