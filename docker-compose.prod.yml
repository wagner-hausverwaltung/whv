# Production override (separate Hetzner box from staging). Same shape as
# docker-compose.staging.yml but APP_ENV=prod and bare-domain URLs. Adds
# Caddy as the TLS terminator and clears every public port except 80/443.
#
# Usage on the prod server (deploy-prod.yml runs these):
#   IMAGE_TAG=<sha> WEB_IMAGE_TAG=<sha> docker compose \
#     -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.deploy.yml up -d
#
# The prod .env MUST set a strong JWT_SECRET and https PORTAL_BASE_URL /
# ADMIN_BASE_URL — with APP_ENV=prod the backend refuses to boot otherwise
# (app/config.py validators). See infra/docs/prod-cutover.md.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # deploy-prod.yml rsyncs Caddyfile.prod to the host as ./Caddyfile.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_started

  # `!reset []` clears the base host-port mappings so postgres/redis/backend
  # are reachable only on the internal docker network (Caddy fronts 80/443).
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  # Only runs when the `rag` profile is enabled (ADR-0013). When it does,
  # keep it off the public internet + auto-restart like the other stores.
  vectordb:
    ports: !reset []
    restart: unless-stopped
  backend:
    ports: !reset []
    restart: unless-stopped
    environment:
      APP_ENV: prod
      LOG_LEVEL: INFO
      PORTAL_BASE_URL: https://portal.wagner-hausverwaltung.com
      ADMIN_BASE_URL: https://admin.wagner-hausverwaltung.com
      EMAIL_INBOUND_ADDRESS: support@wagner-hausverwaltung.com
      EMAIL_FROM_ADDRESS: support@wagner-hausverwaltung.com
      EMAIL_FROM_NAME: Wagner Hausverwaltung Support
      # RAG assistant (ADR-0013) — ON in prod. RAG_DATABASE_URL comes from
      # the base compose; the deploy sets COMPOSE_PROFILES=rag so the
      # vectordb container is up before the backend boots + provisions it.
      # Embeddings reuse GEMINI_API_KEY (from .env). Flip to "false" to
      # disable without removing the infra.
      RAG_ENABLED: "true"

  worker:
    restart: unless-stopped
    # RAG ingestion (OCR + embed) runs in the worker — same flag.
    environment:
      RAG_ENABLED: "true"
  beat:
    restart: unless-stopped

  web:
    ports: !reset []
    restart: unless-stopped

  # DocuSeal for prod. If prod owns signing, point sign.* DNS at this box
  # and migrate the docuseal-data volume off staging (runbook). SECRET_KEY_BASE
  # + the Resend key comes from the prod .env; an empty SECRET_KEY_BASE blocks boot.
  docuseal:
    image: docuseal/docuseal:latest
    restart: unless-stopped
    environment:
      HOST: sign.wagner-hausverwaltung.com
      FORCE_SSL: "true"
      SECRET_KEY_BASE: ${DOCUSEAL_SECRET_KEY_BASE}
      # Outbound mail via RESEND — the same provider + verified sender the
      # backend already uses. AWS SES was never granted production access in
      # eu-central-1, so every recipient that wasn't a verified identity got
      # "554 Message rejected: Email address is not verified" and the signing
      # invite silently never arrived (1357 rejections between 2026-05-28 and
      # 2026-07-29 — gmail/web.de/t-online/company domains alike). DocuSeal's
      # own `sent_at` only records the enqueue, so the admin UI showed these
      # as sent.
      SMTP_ADDRESS: smtp.resend.com
      SMTP_PORT: "587"
      SMTP_USERNAME: resend
      SMTP_PASSWORD: ${RESEND_API_KEY}
      SMTP_FROM: "Wagner Hausverwaltung <noreply@wagner-hausverwaltung.com>"
      SMTP_AUTHENTICATION: login
      SMTP_ENABLE_STARTTLS_AUTO: "true"
    volumes:
      - docuseal-data:/data

volumes:
  caddy-data:
  caddy-config:
  docuseal-data:
