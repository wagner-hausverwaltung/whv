name: deploy-prod

# Manual only — production deploys are deliberate. Run from the Actions tab
# (or `gh workflow run deploy-prod.yml`). Unlike staging, NOT triggered on
# push, so a merge to main never auto-ships to prod.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-prod" to confirm a PRODUCTION deploy'
        required: true
        default: ""

# Never run two prod deploys at once; let an in-flight one finish.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/whv-backend
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/whv-web
  PROD_USER: whv
  PROD_REPO_DIR: /home/whv/whv
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy-prod" ]; then
            echo "::error ::confirm input must be exactly 'deploy-prod'"
            exit 1
          fi

  build-and-push:
    needs: guard
    # Native ARM runner (free for public repos): staging/prod are Hetzner
    # arm64, and building arm64 on an x86 runner meant QEMU emulation — fine
    # while the buildx cache was warm, but GitHub evicts caches after 7 days,
    # so the first deploy after a quiet week took ~8 min instead of ~2.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute short SHA tag
        id: tag
        run: echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend image is environment-agnostic (reads the prod .env at runtime),
      # so the :<sha> tag is identical to staging's — safe to (re)push.
      - name: Build + push backend (linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.short_sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # The web bundle bakes the API + DocuSeal origins at build time, so the
      # PROD bundle differs from staging — tag it `prod-*` to avoid clobbering
      # the staging web image that shares the same commit sha.
      - name: Build + push web (prod-baked URLs)
        uses: docker/build-push-action@v7
        with:
          context: ./web
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:prod-${{ steps.tag.outputs.short_sha }}
            ${{ env.WEB_IMAGE }}:prod-latest
          build-args: |
            VITE_API_BASE_URL=https://api.wagner-hausverwaltung.com
            VITE_DOCUSEAL_URL=https://sign.wagner-hausverwaltung.com
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install SSH key + trust the prod host
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync compose + prod Caddyfile to prod
        run: |
          # Caddyfile.prod lands on the host as ./Caddyfile (what the prod
          # compose mounts). The prod compose file rides along too.
          rsync -avz \
            docker-compose.yml docker-compose.prod.yml docker-compose.deploy.yml \
            -e "ssh -i ~/.ssh/deploy_key" \
            "${{ env.PROD_USER }}@${{ secrets.PROD_SSH_HOST }}:${{ env.PROD_REPO_DIR }}/"
          rsync -avz Caddyfile.prod \
            -e "ssh -i ~/.ssh/deploy_key" \
            "${{ env.PROD_USER }}@${{ secrets.PROD_SSH_HOST }}:${{ env.PROD_REPO_DIR }}/Caddyfile"

      - name: Pull images + migrate + up (cold-start safe)
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          COMPOSE: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.deploy.yml
          TAGS: IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }} WEB_IMAGE_TAG=prod-${{ needs.build-and-push.outputs.image_tag }}
        run: |
          # Works on a fresh box (first boot) AND warm redeploys:
          #  1. pull the new app images
          #  2. up + WAIT for postgres/redis to be healthy, so the migration
          #     can connect even when nothing was running before
          #  3. apply migrations
          #  4. full `up -d` — starts/updates everything incl. caddy (which
          #     provisions Let's Encrypt certs on its first container start)
          #     and docuseal; unchanged infra containers are left running.
          # COMPOSE_PROFILES=rag includes the pgvector `vectordb` container
          # (ADR-0013); it's added to --wait so it's healthy BEFORE the
          # backend boots (the backend provisions the RAG store on startup
          # when RAG_ENABLED=true, set in docker-compose.prod.yml).
          ssh -i ~/.ssh/deploy_key "${{ env.PROD_USER }}@${{ secrets.PROD_SSH_HOST }}" \
            "cd ${{ env.PROD_REPO_DIR }} && export COMPOSE_PROFILES=rag && \
             ${TAGS} ${COMPOSE} pull backend worker beat web && \
             ${TAGS} ${COMPOSE} up -d --wait postgres redis vectordb && \
             ${TAGS} ${COMPOSE} run --rm backend alembic upgrade head && \
             ${TAGS} ${COMPOSE} up -d"

      - name: Recreate Caddy to pick up Caddyfile changes
        # The Caddyfile is a SINGLE-FILE bind mount; rsync's atomic replace
        # gives it a new inode, so the running container keeps the old one and
        # `caddy reload` reads stale content. Recreating re-resolves the mount
        # to the current file — and a fresh process also clears ACME back-off,
        # which the header / frame-ancestors / new-vhost cases need (see
        # infra/docs/prod-cutover.md). ~1-2s blip across the fronted sites.
        run: |
          ssh -i ~/.ssh/deploy_key "${{ env.PROD_USER }}@${{ secrets.PROD_SSH_HOST }}" \
            "cd ${{ env.PROD_REPO_DIR }} && \
             docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps --force-recreate caddy"

      - name: Verify /healthz over HTTPS
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              https://api.wagner-hausverwaltung.com/healthz || echo "000")
            echo "attempt $i → $code"
            if [ "$code" = "200" ]; then
              echo "::notice ::prod deploy OK — /healthz 200 for ${{ needs.build-and-push.outputs.image_tag }}"
              exit 0
            fi
            sleep 5
          done
          echo "::error ::prod /healthz did not return 200 within 60s"
          exit 1

      - name: Prune superseded Docker images
        # Same disk-fill protection as staging (2026-07-14 incident: prod was
        # at 91% when staging died at 100%). After-health-check only; keeps
        # 7 days of images for instant rollback. Best-effort.
        if: success()
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key "${{ env.PROD_USER }}@${{ secrets.PROD_SSH_HOST }}" \
            "docker image prune -af --filter 'until=168h' && docker builder prune -f && df -h / | tail -1"
