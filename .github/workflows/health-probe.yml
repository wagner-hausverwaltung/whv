# Recurring health probe for the WHV stack (staging + prod) — spec §15.1 #1.
#
# Runs every 30 min on GitHub Actions. Per environment:
#   • <api>/healthz   (FastAPI liveness)
#   • <api>/readyz    (Postgres + Redis dep checks)
# plus, once:
#   • prod portal /   (SPA shell actually served, not an nginx error page)
#   • Impower /properties?size=1  (upstream API still answering)
#
# Failure modes:
#   - Any staging/prod /healthz or /readyz non-200 (or readyz reports a
#     dead dep), or the prod portal not serving → workflow fails → GitHub
#     emails repo admins. BOTH envs are checked every run, so one failure
#     never masks the other.
#   - Impower 5xx/timeout (their DEV replica down) → ::warning:: only,
#     the probe still passes — it's their outage, not ours. A 401/403
#     from Impower (our token broke) DOES fail.
#   - For broader notification (Slack, PagerDuty), wire an
#     `on: workflow_run` follow-up later.
#
# Manual run: gh workflow run health-probe.yml --ref main

name: health-probe

on:
  schedule:
    # Every 30 minutes. GH cron is UTC. "Every 30 min" is intentionally
    # loose — actual runs drift a few minutes during low-priority windows.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: API health (staging + prod)
        # Checks /healthz + /readyz (+ both deps) for each environment.
        # We accumulate rc instead of aborting on the first failure, so a
        # staging outage never hides a prod one (and vice versa).
        run: |
          set -uo pipefail
          check() {
            local base="$1" env="$2" s
            echo "── $env ($base)"
            s=$(curl -sS -o /tmp/h.body -w '%{http_code}' --max-time 10 "$base/healthz" || echo 000)
            echo "  /healthz HTTP $s"; cat /tmp/h.body 2>/dev/null; echo
            if [ "$s" != "200" ]; then echo "::error title=$env API liveness::/healthz returned $s"; return 1; fi
            s=$(curl -sS -o /tmp/r.body -w '%{http_code}' --max-time 15 "$base/readyz" || echo 000)
            echo "  /readyz HTTP $s"; cat /tmp/r.body 2>/dev/null; echo
            if [ "$s" != "200" ]; then echo "::error title=$env API readiness::/readyz returned $s"; return 1; fi
            grep -q '"postgres":[[:space:]]*true' /tmp/r.body || { echo "::error title=$env postgres dep::readyz reports postgres down"; return 1; }
            grep -q '"redis":[[:space:]]*true' /tmp/r.body || { echo "::error title=$env redis dep::readyz reports redis down"; return 1; }
            echo "  OK"
          }
          rc=0
          check https://staging.api.wagner-hausverwaltung.com staging || rc=1
          check https://api.wagner-hausverwaltung.com prod || rc=1
          exit $rc

      - name: Portal (prod)
        # The portal is a static SPA behind Caddy→nginx. A 200 carrying the
        # SPA mount node (id="root") proves the app shell is really served,
        # not an nginx 5xx / placeholder page.
        run: |
          set -uo pipefail
          s=$(curl -sS -o /tmp/portal.html -w '%{http_code}' --max-time 10 \
            https://portal.wagner-hausverwaltung.com/ || echo 000)
          echo "HTTP $s"
          if [ "$s" != "200" ]; then echo "::error title=Portal down::/ returned $s"; exit 1; fi
          if ! grep -q 'id="root"' /tmp/portal.html; then
            echo "::error title=Portal not serving app::index.html missing the SPA mount node"
            head -c 200 /tmp/portal.html; exit 1
          fi
          echo "OK — SPA shell served"

      - name: Impower upstream
        # The working URL is the prod-replica dev instance Impower gave
        # us for staging — `api.app.impower.de` (the original
        # placeholder) returns 404 on every path. Verified 200 on
        # 2026-05-25 with the staging .env's IMPOWER_API_TOKEN.
        # GH Actions forbids `secrets.X` inside `if:` expressions, so
        # we pipe the token via env var and gate inside the script.
        #
        # Impower's replica is a DEV instance that goes down for
        # maintenance — a 5xx/timeout there is THEIR outage, not ours.
        # So we retry, then downgrade to a ::warning:: (yellow, no
        # failure email) instead of failing this probe. We still
        # HARD-fail on 401/403 (our token broke) and other unexpected
        # non-2xx; staging /healthz + /readyz above stay hard failures.
        env:
          IMPOWER_TOKEN: ${{ secrets.IMPOWER_API_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${IMPOWER_TOKEN:-}" ]; then
            echo "IMPOWER_API_TOKEN not configured — skipping"
            exit 0
          fi
          status=000
          for attempt in 1 2 3; do
            status=$(curl -sS -o /tmp/impower.body -w '%{http_code}' \
              --max-time 15 \
              -H "Authorization: Bearer $IMPOWER_TOKEN" \
              'https://api.prod-replica.develop.impower.de/v2/properties?size=1' || echo 000)
            echo "attempt $attempt: HTTP $status"
            [ "$status" = "200" ] && break
            [ "$attempt" -lt 3 ] && sleep 5
          done
          # First 200 chars of body for diagnostic, never the auth header.
          head -c 200 /tmp/impower.body 2>/dev/null || true
          echo
          if [ "$status" = "200" ]; then
            exit 0
          fi
          # 000 = curl failed (timeout/DNS/conn); 5xx = Impower infra
          # down. Both are Impower-side outages → warn, don't fail.
          if [ "$status" = "000" ] || [ "$status" -ge 500 ]; then
            echo "::warning title=Impower upstream unavailable::Impower replica returned HTTP ${status} (their outage) — not failing the probe."
            exit 0
          fi
          # Anything else (401/403 = our token broke, unexpected 4xx) is
          # actionable for US → hard fail.
          echo "::error title=Impower check failed::Unexpected HTTP ${status} from Impower (token or contract change)."
          exit 1
