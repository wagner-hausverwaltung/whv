name: deploy-staging

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "web/**"
      - "docker-compose.yml"
      - "docker-compose.staging.yml"
      - "docker-compose.deploy.yml"
      - "Caddyfile"
      - ".github/workflows/deploy.yml"

# Only one deploy at a time. Don't cancel an in-flight deploy if a new push lands;
# let it finish, then the next push deploys on top.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/whv-backend
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/whv-web
  STAGING_USER: whv
  STAGING_REPO_DIR: /home/whv/whv
  # Opt JS actions into Node 24 ahead of the 2026-06-02 default switch.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute short SHA tag
        id: tag
        run: echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push backend (linux/arm64; staging runs Hetzner cax21)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.short_sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build + push web (linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: ./web
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.tag.outputs.short_sha }}
            ${{ env.WEB_IMAGE }}:latest
          build-args: |
            VITE_API_BASE_URL=https://staging.api.wagner-hausverwaltung.com
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install SSH key + trust the staging host
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_HOST: ${{ secrets.STAGING_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync compose/Caddyfile to staging
        run: |
          rsync -avz \
            docker-compose.yml docker-compose.staging.yml docker-compose.deploy.yml Caddyfile \
            -e "ssh -i ~/.ssh/deploy_key" \
            "${{ env.STAGING_USER }}@${{ secrets.STAGING_SSH_HOST }}:${{ env.STAGING_REPO_DIR }}/"

      - name: Pull images + apply migrations + restart services
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          ssh -i ~/.ssh/deploy_key "${{ env.STAGING_USER }}@${{ secrets.STAGING_SSH_HOST }}" \
            "cd ${{ env.STAGING_REPO_DIR }} && \
             IMAGE_TAG=${IMAGE_TAG} WEB_IMAGE_TAG=${IMAGE_TAG} docker compose -f docker-compose.yml -f docker-compose.staging.yml -f docker-compose.deploy.yml pull backend worker beat web && \
             IMAGE_TAG=${IMAGE_TAG} docker compose -f docker-compose.yml -f docker-compose.staging.yml -f docker-compose.deploy.yml run --rm backend alembic upgrade head && \
             IMAGE_TAG=${IMAGE_TAG} WEB_IMAGE_TAG=${IMAGE_TAG} docker compose -f docker-compose.yml -f docker-compose.staging.yml -f docker-compose.deploy.yml up -d --no-deps backend worker beat web"

      - name: Recreate Caddy to pick up Caddyfile changes
        # The Caddyfile is a SINGLE-FILE bind mount. rsync replaces it
        # atomically (temp + rename = new inode), so the running container
        # keeps the OLD inode and `caddy reload` silently re-reads stale
        # content (this is why a Caddyfile change once sat un-applied for
        # weeks). Recreating the container re-resolves the bind mount to the
        # current file — ~1-2s blip, and a fresh process also clears ACME
        # back-off. --no-deps so only caddy is touched.
        run: |
          ssh -i ~/.ssh/deploy_key "${{ env.STAGING_USER }}@${{ secrets.STAGING_SSH_HOST }}" \
            "cd ${{ env.STAGING_REPO_DIR }} && \
             docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --no-deps --force-recreate caddy"

      - name: Verify /healthz over HTTPS
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              https://staging.api.wagner-hausverwaltung.com/healthz || echo "000")
            echo "attempt $i → $code"
            if [ "$code" = "200" ]; then
              echo "::notice ::deploy OK — staging /healthz returned 200 for ${{ needs.build-and-push.outputs.image_tag }}"
              exit 0
            fi
            sleep 5
          done
          echo "::error ::staging /healthz did not return 200 within 60s"
          exit 1
