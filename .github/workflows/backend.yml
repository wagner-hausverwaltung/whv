name: backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - run: uv sync --frozen
      - run: uv run mypy app/

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: whv
          POSTGRES_PASSWORD: whv
          POSTGRES_DB: whv
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whv -d whv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://whv:whv@localhost:5432/whv
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - run: uv sync --frozen
      - name: Run migrations (verifies migration applies cleanly)
        run: uv run alembic upgrade head
      - run: uv run pytest

  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: whv-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
