name: prod-doc-acl-stats

# On-demand, READ-ONLY diagnostic for the document-ACL exposure (#153).
# The portal/assistant ACL gate (app/api/v1/me.py _document_visibility_filter)
# treats a document with ALL THREE owner FKs NULL (unit_id, contract_id,
# contact_id) as "property-wide" — visible to everyone who can see the
# property. Per-user financial docs (Hausgeld-/Betriebskosten-/Heizkosten-
# abrechnung) map to kind=JAHRESABRECHNUNG; if any landed without an FK they
# are currently cross-user visible. The DocumentVisibility enum is NOT
# enforced today. This job quantifies the blast radius (counts only — no
# names, no content, no PII) so we can design the right stopgap.
#
# Runs inside the already-deployed backend container using the app's
# settings.database_url (asyncpg). No app/RAG-store state is changed.
on:
  workflow_dispatch:

env:
  PROD_USER: whv
  PROD_REPO_DIR: /home/whv/whv

jobs:
  stats:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install SSH key + trust the prod host
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Aggregate document ACL exposure (read-only)
        env:
          COMPOSE: docker compose -f docker-compose.yml -f docker-compose.prod.yml
        run: |
          ssh -i ~/.ssh/deploy_key "${PROD_USER}@${{ secrets.PROD_SSH_HOST }}" \
            "cd ${PROD_REPO_DIR} && ${COMPOSE} exec -T backend python -" <<'PY'
          import asyncio

          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          from app.config import get_settings

          # "Property-wide": none of the per-owner FKs set -> the ACL filter
          # makes the doc visible to every caller who can see the property.
          WIDE = "unit_id IS NULL AND contract_id IS NULL AND contact_id IS NULL"


          async def main() -> None:
              engine = create_async_engine(get_settings().database_url)
              async with engine.connect() as conn:

                  async def rows(sql: str):
                      res = await conn.execute(text(sql))
                      return res.fetchall()

                  total = (await rows("SELECT count(*) FROM documents WHERE deleted_at IS NULL"))[0][0]
                  wide_total = (
                      await rows(f"SELECT count(*) FROM documents WHERE deleted_at IS NULL AND {WIDE}")
                  )[0][0]
                  print(f"LIVE DOCUMENTS: {total}")
                  print(f"PROPERTY-WIDE (all owner FKs NULL): {wide_total}  "
                        f"({(100*wide_total//total) if total else 0}% of corpus)")

                  print("\n=== BY KIND (total | property-wide | fk-scoped) ===")
                  for k, tot, wide, scoped in await rows(
                      f"""SELECT kind, count(*) AS total,
                                count(*) FILTER (WHERE {WIDE}) AS wide,
                                count(*) FILTER (WHERE NOT ({WIDE})) AS scoped
                          FROM documents WHERE deleted_at IS NULL
                          GROUP BY kind ORDER BY total DESC"""
                  ):
                      print(f"  {str(k):20s} {tot:6d} | wide={wide:6d} | scoped={scoped:6d}")

                  print("\n=== BY VISIBILITY ENUM (currently UNENFORCED) ===")
                  for v, c in await rows(
                      "SELECT visibility, count(*) FROM documents WHERE deleted_at IS NULL "
                      "GROUP BY visibility ORDER BY count(*) DESC"
                  ):
                      print(f"  {str(v):20s} {c:6d}")

                  print("\n=== BY IMPOWER SOURCE TYPE (total | property-wide) — exposure surface ===")
                  for src, tot, wide in await rows(
                      f"""SELECT coalesce(impower_source_type, '(null)') AS src,
                                count(*) AS total,
                                count(*) FILTER (WHERE {WIDE}) AS wide
                          FROM documents WHERE deleted_at IS NULL
                          GROUP BY src ORDER BY total DESC LIMIT 40"""
                  ):
                      print(f"  {str(src):42s} {tot:6d} | wide={wide:6d}")

                  print("\n=== HEADLINE EXPOSURE ===")
                  jahr_wide = (
                      await rows(
                          f"SELECT count(*) FROM documents WHERE deleted_at IS NULL "
                          f"AND kind = 'JAHRESABRECHNUNG' AND {WIDE}"
                      )
                  )[0][0]
                  print(f"  JAHRESABRECHNUNG that are property-wide (per-user financial, "
                        f"currently cross-user visible): {jahr_wide}")

                  # ----- ATTRIBUTION PROBE (#153 full fix) -----
                  # For docs we currently treat as property-wide (all FKs NULL),
                  # what owner reference did Impower actually send? raw_jsonb keys
                  # are camelCase (model_dump field names). If unitId/contractId/
                  # contactId is present but our FK is NULL, the referenced entity
                  # simply wasn't in our DB at sync time -> a re-sync would attribute
                  # it. If all three are absent, Impower didn't attribute the
                  # document object itself (only sourceId+sourceType), so attribution
                  # must be resolved through the source entity.
                  print("\n=== ATTRIBUTION PROBE: raw_jsonb owner refs on PROPERTY-WIDE docs ===")
                  personal = (
                      "AND (kind = 'JAHRESABRECHNUNG' OR impower_source_type IN "
                      "('HOUSE_MONEY_SETTLEMENT','HEATING_COST_DISTRIBUTION','OPS_COST_REPORT',"
                      "'RENT_SETTLEMENT_EXCHANGE','SPECIAL_CONTRIBUTION'))"
                  )
                  for label, extra in [("ALL property-wide", ""),
                                       ("personal-financial property-wide", personal)]:
                      r = (await rows(
                          f"""SELECT count(*) AS total,
                                count(*) FILTER (WHERE raw_jsonb->>'unitId' IS NOT NULL) AS u,
                                count(*) FILTER (WHERE raw_jsonb->>'contractId' IS NOT NULL) AS ct,
                                count(*) FILTER (WHERE raw_jsonb->>'contactId' IS NOT NULL) AS c,
                                count(*) FILTER (WHERE raw_jsonb->>'sourceId' IS NOT NULL) AS s,
                                count(*) FILTER (WHERE raw_jsonb->>'unitId' IS NULL
                                    AND raw_jsonb->>'contractId' IS NULL
                                    AND raw_jsonb->>'contactId' IS NULL) AS none_ref
                              FROM documents WHERE deleted_at IS NULL AND {WIDE} {extra}"""
                      ))[0]
                      print(f"  [{label}] total={r[0]} | raw unitId={r[1]} contractId={r[2]} "
                            f"contactId={r[3]} sourceId={r[4]} | NO owner ref={r[5]}")

                  # Backfillable NOW: raw owner ref is present AND resolves to a
                  # synced entity (EXISTS, so no row multiplication). The numeric
                  # guard keeps a stray non-int value from breaking the ::bigint cast.
                  print("\n=== BACKFILLABLE NOW (raw ref resolves to a synced entity) ===")
                  b = (await rows(
                      f"""SELECT
                            count(*) FILTER (WHERE d.raw_jsonb->>'contactId' ~ '^[0-9]+$'
                              AND EXISTS (SELECT 1 FROM contacts x
                                WHERE x.impower_id = (d.raw_jsonb->>'contactId')::bigint)) AS c,
                            count(*) FILTER (WHERE d.raw_jsonb->>'contractId' ~ '^[0-9]+$'
                              AND EXISTS (SELECT 1 FROM contracts x
                                WHERE x.impower_id = (d.raw_jsonb->>'contractId')::bigint)) AS ct,
                            count(*) FILTER (WHERE d.raw_jsonb->>'unitId' ~ '^[0-9]+$'
                              AND EXISTS (SELECT 1 FROM units x
                                WHERE x.impower_id = (d.raw_jsonb->>'unitId')::bigint)) AS u
                          FROM documents d WHERE d.deleted_at IS NULL AND {WIDE}"""
                  ))[0]
                  print(f"  contact-resolvable={b[0]} contract-resolvable={b[1]} unit-resolvable={b[2]}")

                  # Whole-WEG aggregate (Gesamt*) vs per-owner (Einzel*) — the
                  # name carries the document TYPE keyword (not PII). This decides
                  # whether the 142 are correctly property-wide (over-hidden by the
                  # stopgap) or individual docs needing sourceId->owner attribution.
                  print("\n=== NAME-TYPE PROBE on personal-financial property-wide (type keywords) ===")
                  for pat, lbl in [("gesamt", "Gesamt* (whole-WEG aggregate)"),
                                   ("einzel", "Einzel* (per-owner)"),
                                   ("hausgeld", "hausgeld*"),
                                   ("heizkost", "heizkost*"),
                                   ("betriebskost", "betriebskost*"),
                                   ("abrechnung", "*abrechnung*")]:
                      n = (await rows(
                          f"SELECT count(*) FROM documents WHERE deleted_at IS NULL "
                          f"AND {WIDE} {personal} AND lower(name) LIKE '%{pat}%'"
                      ))[0][0]
                      print(f"  name~{lbl:34s}: {n}")
                  ds = (await rows(
                      f"SELECT count(DISTINCT raw_jsonb->>'sourceId') FROM documents "
                      f"WHERE deleted_at IS NULL AND {WIDE} {personal}"
                  ))[0][0]
                  print(f"  distinct sourceId across the 142: {ds}")

              await engine.dispose()


          asyncio.run(main())
          PY
