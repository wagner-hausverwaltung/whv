name: prod-assistant-probe

# Read-only: reproduce the assistant's retrieval for a question on a property
# and dump the raw signals (query-vector sanity, chunk counts behind the
# filters, raw cosine nearest-neighbours, and retrieve() results) to tell a
# similarity miss from an ACL/filter miss. No writes.
on:
  workflow_dispatch:
    inputs:
      question:
        description: "Question to embed"
        required: false
        default: "was waren die Themen auf der letzten ETV"
      needle:
        description: "Property name substring"
        required: false
        default: "Hasenberg"

env:
  PROD_USER: whv
  PROD_REPO_DIR: /home/whv/whv

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install SSH key + trust the prod host
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Probe retrieval
        env:
          COMPOSE: docker compose -f docker-compose.yml -f docker-compose.prod.yml
          Q_INPUT: ${{ github.event.inputs.question }}
          NEEDLE_INPUT: ${{ github.event.inputs.needle }}
        run: |
          ssh -i ~/.ssh/deploy_key "${PROD_USER}@${{ secrets.PROD_SSH_HOST }}" \
            "cd ${PROD_REPO_DIR} && Q='${Q_INPUT}' NEEDLE='${NEEDLE_INPUT}' ${COMPOSE} exec -T -e Q -e NEEDLE backend python -" <<'PY'
          import asyncio
          import math
          import os

          from sqlalchemy import select, text
          from sqlalchemy.ext.asyncio import async_sessionmaker, create_async_engine

          from app.config import get_settings
          from app.integrations.llm import get_llm_provider
          from app.models.property import Property
          from app.rag.retrieval import CallerScope, retrieve

          NEEDLE = os.environ.get("NEEDLE", "Hasenberg")
          Q = os.environ.get("Q", "was waren die Themen auf der letzten ETV")


          async def main() -> None:
              s = get_settings()
              app_engine = create_async_engine(s.database_url)
              rag_engine = create_async_engine(s.rag_database_url)
              try:
                  sm = async_sessionmaker(app_engine, expire_on_commit=False)
                  async with sm() as sess:
                      prop = (
                          await sess.scalars(select(Property).where(Property.name.ilike(f"%{NEEDLE}%")))
                      ).first()
                  print(f"property: {prop.id} | org: {prop.organization_id} | {prop.name}")
                  print(f"question: {Q!r}")

                  qvec = (await get_llm_provider().embed_texts([Q], task_type="retrieval_query"))[0]
                  norm = math.sqrt(sum(x * x for x in qvec))
                  print(f"qvec: dim={len(qvec)} norm={norm:.4f} head={[round(x, 4) for x in qvec[:3]]}")

                  vlit = "[" + ",".join(repr(float(x)) for x in qvec) + "]"
                  rm = async_sessionmaker(rag_engine, expire_on_commit=False)
                  async with rm() as rag:
                      for label, sql, params in [
                          ("chunks org+prop", "SELECT count(*) FROM rag_chunks WHERE organization_id=:o AND property_id=:p", {"o": prop.organization_id, "p": prop.id}),
                          ("chunks prop-only", "SELECT count(*) FROM rag_chunks WHERE property_id=:p", {"p": prop.id}),
                          ("chunks org-only", "SELECT count(*) FROM rag_chunks WHERE organization_id=:o", {"o": prop.organization_id}),
                          ("etv chunks org", "SELECT count(*) FROM rag_chunks WHERE organization_id=:o AND source_type='etv'", {"o": prop.organization_id}),
                      ]:
                          n = (await rag.execute(text(sql), params)).scalar_one()
                          print(f"  {label}: {n}")

                      rows = (
                          await rag.execute(
                              text(
                                  "SELECT source_type, source_kind, (embedding <=> (:v)::vector) AS dist "
                                  "FROM rag_chunks WHERE property_id=:p ORDER BY dist LIMIT 8"
                              ),
                              {"v": vlit, "p": prop.id},
                          )
                      ).fetchall()
                      print(f"  raw NN for property: {len(rows)}")
                      for st, sk, dist in rows:
                          print(f"    dist={float(dist):.3f} sim={1 - float(dist):.3f} type={st} kind={sk}")

                      scope = CallerScope(
                          organization_id=prop.organization_id, is_verwalter=True, visible_document_ids=None
                      )
                      for pid in (prop.id, None):
                          got = await retrieve(
                              rag, scope=scope, query_embedding=qvec, top_k=8, min_similarity=0.0, property_id=pid
                          )
                          print(f"  retrieve(property_id={'prop' if pid else 'None'}, min_sim=0.0): {len(got)} hits; types={[c.source_type for c in got]}")
              finally:
                  await app_engine.dispose()
                  await rag_engine.dispose()


          asyncio.run(main())
          PY
