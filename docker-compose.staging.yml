# Staging override: adds Caddy as the public TLS terminator and removes
# every public port mapping except 80/443 (which Caddy owns).
#
# Usage on the staging server:
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --build

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_started

  # Compose v2 merges sequences by concat — a plain `ports: []` override would
  # be appended to the base, leaving the host port mappings in place. The
  # `!reset []` tag explicitly clears the sequence so postgres/redis/backend
  # are reachable only via the internal docker network on staging. Requires
  # compose ≥ v2.20 (staging's Docker 29.5 ships v2.36+).
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  backend:
    ports: !reset []
    restart: unless-stopped
    environment:
      APP_ENV: staging
      LOG_LEVEL: INFO
      PORTAL_BASE_URL: https://staging.portal.wagner-hausverwaltung.com
      ADMIN_BASE_URL: https://staging.admin.wagner-hausverwaltung.com

  web:
    ports: !reset []
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
