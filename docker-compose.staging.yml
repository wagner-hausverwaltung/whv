# Staging override: adds Caddy as the public TLS terminator and removes
# every public port mapping except 80/443 (which Caddy owns).
#
# Usage on the staging server:
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --build

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - /srv/slr-pipeline/compose/caddy:/etc/caddy/slr:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - default
      - slr_proxy

  # Compose v2 merges sequences by concat — a plain `ports: []` override would
  # be appended to the base, leaving the host port mappings in place. The
  # `!reset []` tag explicitly clears the sequence so postgres/redis/backend
  # are reachable only via the internal docker network on staging. Requires
  # compose ≥ v2.20 (staging's Docker 29.5 ships v2.36+).
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  backend:
    ports: !reset []
    restart: unless-stopped
    environment:
      APP_ENV: staging
      LOG_LEVEL: INFO
      PORTAL_BASE_URL: https://staging.portal.wagner-hausverwaltung.com
      ADMIN_BASE_URL: https://staging.admin.wagner-hausverwaltung.com
      # SES is configured to receive at support@…, so every ticket
      # notification carries Reply-To: support@…. Hitting "Reply" in
      # the recipient's mail client lands the response back on the
      # inbound webhook → next message on the same ticket — closes the
      # email loop, no portal visit required. Without this the SPA's
      # "Im Portal antworten" link is the only path forward, which the
      # user (rightly) flagged as broken UX (2026-05-25).
      EMAIL_INBOUND_ADDRESS: support@wagner-hausverwaltung.com
      # Also send FROM support@ (instead of the default noreply@) so
      # the recipient's mail client visually shows a reply-friendly
      # address. Reply-To above stays as belt-and-braces. DKIM/SPF on
      # wagner-hausverwaltung.com already covers every address @
      # that domain, so deliverability isn't affected by the swap.
      EMAIL_FROM_ADDRESS: support@wagner-hausverwaltung.com
      EMAIL_FROM_NAME: Wagner Hausverwaltung Support

  web:
    ports: !reset []
    restart: unless-stopped

  # DocuSeal e-signature (ADR-0012). Self-hosted, SQLite-backed (the
  # docuseal-data volume holds the DB + signed PDFs). Outbound mail via
  # Resend SMTP so signing invites come from the WHV sender. No public
  # port — it shares the stack network, and Caddy reverse-proxies
  # sign.wagner-hausverwaltung.com → docuseal:3000. SECRET_KEY_BASE +
  # Resend key comes from the host .env; an empty SECRET_KEY_BASE stops it
  # booting, so set those before `up -d docuseal`. Not in the deploy
  # auto-up list — brought up once, then restart:unless-stopped keeps it.
  docuseal:
    image: docuseal/docuseal:latest
    restart: unless-stopped
    environment:
      HOST: sign.wagner-hausverwaltung.com
      FORCE_SSL: "true"
      SECRET_KEY_BASE: ${DOCUSEAL_SECRET_KEY_BASE}
      # Outbound mail via RESEND — the same provider + verified sender the
      # backend already uses. AWS SES was never granted production access in
      # eu-central-1, so every recipient that wasn't a verified identity got
      # "554 Message rejected: Email address is not verified" and the signing
      # invite silently never arrived (1357 rejections between 2026-05-28 and
      # 2026-07-29 — gmail/web.de/t-online/company domains alike). DocuSeal's
      # own `sent_at` only records the enqueue, so the admin UI showed these
      # as sent.
      SMTP_ADDRESS: smtp.resend.com
      SMTP_PORT: "587"
      SMTP_USERNAME: resend
      SMTP_PASSWORD: ${RESEND_API_KEY}
      SMTP_FROM: "Wagner Hausverwaltung <noreply@wagner-hausverwaltung.com>"
      SMTP_AUTHENTICATION: login
      SMTP_ENABLE_STARTTLS_AUTO: "true"
    volumes:
      - docuseal-data:/data

volumes:
  caddy-data:
  caddy-config:
  docuseal-data:

networks:
  slr_proxy:
    external: true
